name: Daily Berkeley meals

on:
  schedule:
    # Plain UTC triggers cover both Pacific offsets. Python skips pre-7 AM runs.
    # Retain 7 AM targeting, with off-hour retries and idempotent recovery.
    - cron: '0,23 14,15 * * *'
    - cron: '57 15 * * *'
    - cron: '17 16 * * *'
  workflow_dispatch:
    inputs:
      write_tasks:
        description: 'Create/update today’s two Google Tasks (false runs a live dry test)'
        type: boolean
        default: false
      recovery_only:
        description: 'Preserve an existing complete daily plan (requires write_tasks)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: berkeley-meals-single-writer
  cancel-in-progress: false

jobs:
  plan:
    # Must be set only after checking free allowance and a $0 stop-spending policy
    # (or no payment method). Gating before runner allocation avoids accidental costs.
    if: vars.ZERO_COST_VERIFIED == 'true' && (vars.GOOGLE_OAUTH_READY == 'true' || (github.event_name == 'workflow_dispatch' && !inputs.write_tasks))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # No dependency cache or artifact storage.
      - name: Install small pinned dependency set
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Test safety and reconciliation
        run: python -m pytest -q
      - name: Retrieve official menus, plan, and verify tasks
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          WRITE_TASKS: ${{ github.event_name == 'schedule' || inputs.write_tasks }}
          RECOVERY_ONLY: ${{ github.event_name == 'schedule' || inputs.recovery_only }}
          SCHEDULED_RUN: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$SCHEDULED_RUN" = 'true' ]; then
            python mealplanner.py --write --if-missing --scheduled
          elif [ "$WRITE_TASKS" = 'true' ]; then
            if [ "$RECOVERY_ONLY" = 'true' ]; then
              python mealplanner.py --write --if-missing
            else
              python mealplanner.py --write
            fi
          else
            python mealplanner.py
          fi
      - name: Execution summary
        if: always()
        run: |
          python scripts/summarize.py >> "$GITHUB_STEP_SUMMARY"
